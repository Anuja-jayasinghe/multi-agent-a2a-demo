# Separate ports for gRPC and plain HTTP (Quarkus's own default — do not
# combine them: a combined port breaks the well-known agent-card HTTP GET
# for any client whose http:Client doesn't speak HTTP/2-prior-knowledge
# cleartext, which is how ballerina/a2a's own http:Client behaves by
# default. Confirmed by reproducing: bal's plain resolveAgentCard() got a
# synthesized 400 with an empty body against a combined port; forcing
# httpVersion=1.1 on the client worked around it, but that's not a fix a
# real caller of ballerina/a2a should have to know to apply — the server
# should just serve plain HTTP on its own port, so this stays separated.
quarkus.http.host=0.0.0.0
quarkus.http.port=8003
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=9003
# What the agent card advertises to other clients — "localhost" for
# local-process use, overridden to this container's Compose service name
# in docker-compose.yml. Independent of the bind host above.
a2a.advertised-host=${A2A_ADVERTISED_HOST:localhost}
# ballerina/http's default client negotiation (HTTP/2 cleartext prior
# knowledge) does not interop with Vert.x's h2c handling here — confirmed
# by reproducing: resolveAgentCard() got a synthesized 400 with an empty
# body even once gRPC had its own dedicated port. Pinning this endpoint to
# HTTP/1.1 only (a legitimate, common choice for a plain REST/JSON
# endpoint) makes the negotiation moot rather than requiring every
# ballerina/a2a caller to know to override httpVersion.
quarkus.http.http2=false

# No default beyond a placeholder: without a real key, calls fail at the
# Anthropic API itself with a real 401 — that's the graceful-failure
# behavior verified structurally in commit 2, not a value we fabricate.
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:unset}
quarkus.langchain4j.anthropic.timeout=40000
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-5

# Shared secret gating the admin-only extended agent card skill (Phase 4, commit 5).
# No explicit ${PAYROLL_ADMIN_TOKEN:...} expression here on purpose --
# Quarkus/SmallRye's env-var name mapping already resolves this key from
# PAYROLL_ADMIN_TOKEN directly, and AdminOnlyExtendedCardInterceptor's own
# @ConfigProperty(defaultValue = "") is what actually guarantees a value
# when it's unset. An explicit ${VAR:} expression here was found to throw
# "Failed to load config value" and fail the whole app's startup the
# moment the env var was genuinely empty rather than always carrying the
# demo secret it used to.
